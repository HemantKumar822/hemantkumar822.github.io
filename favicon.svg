<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="64" height="64" fill="#ffd93d"/>
  <rect width="64" height="64" fill="none" stroke="#000" stroke-width="4"/>

  <!-- H Letter Box -->
  <rect x="4" y="12" width="24" height="28" fill="#66d9ef" stroke="#000" stroke-width="2.5"/>
  <rect x="7" y="15" width="24" height="28" fill="none" stroke="#000" stroke-width="1.5" opacity="0.25"/>

  <!-- K Letter Box -->
  <rect x="36" y="12" width="24" height="28" fill="#ff6b9d" stroke="#000" stroke-width="2.5"/>
  <rect x="39" y="15" width="24" height="28" fill="none" stroke="#000" stroke-width="1.5" opacity="0.25"/>

  <!-- H Letter -->
  <text x="16" y="35" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="#000" text-anchor="middle">H</text>

  <!-- K Letter -->
  <text x="48" y="35" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="#000" text-anchor="middle">K</text>

  <!-- Bottom strip -->
  <rect x="4" y="46" width="56" height="14" fill="#000"/>
  <text x="32" y="57" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffd93d" text-anchor="middle" letter-spacing="2">DEV</text>
</svg>
